<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline | Aquilala</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f3f6f4;
            color: #2c3530;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card { max-width: 420px; width: 100%; }
        /* The mark sits on a plain white tile, never on a dark green box:
           a logo with a colour behind it reads as an error badge. */
        .logo-tile {
            width: 112px; height: 112px; margin: 0 auto 22px;
            background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 10px rgba(20, 61, 35, 0.06);
        }
        .logo-tile img { width: 72px; height: 72px; }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; color: #143d23; }
        p { font-size: 14.5px; line-height: 1.65; color: #64748b; margin-bottom: 26px; }
        button {
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            background: #143d23;
            color: #fff;
            border: none;
            border-radius: 11px;
            padding: 13px 26px;
            cursor: pointer;
        }
        button:hover { background: #0f2f1b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-tile">
            <img src="/images/logo.png" alt="Aquilala">
        </div>
        <h1>You're offline</h1>
        <p>
            No internet connection right now. Reconnect to continue working in Aquilala.
        </p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
